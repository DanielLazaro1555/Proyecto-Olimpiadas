<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión — Olimpiadas Perú</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 flex items-center justify-center p-4">

    <div class="w-full max-w-md">

      <!-- Logo y título -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-yellow-400 rounded-full mb-4 shadow-lg">
          <span class="text-3xl">🏅</span>
        </div>
        <h1 class="text-3xl font-bold text-white">Olimpiadas Perú</h1>
        <p class="text-blue-200 mt-1">Sistema de Gestión Deportiva</p>
      </div>

      <!-- Tarjeta de login -->
      <div class="bg-white rounded-2xl shadow-2xl p-8">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">Iniciar sesión</h2>

        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="username">
              Usuario
            </label>
            <input
              id="username"
              type="text"
              placeholder="Ingresa tu usuario"
              autocomplete="off"
              required
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="password">
              Contraseña
            </label>
            <div class="relative">
              <input
                id="password"
                type="password"
                placeholder="Ingresa tu contraseña"
                required
                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition pr-10"
              />
              <button
                type="button"
                id="togglePassword"
                class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600"
                tabindex="-1"
              >
                👁
              </button>
            </div>
          </div>

          <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-2.5 rounded-lg"></div>

          <button
            type="submit"
            id="submitBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 flex items-center justify-center gap-2"
          >
            <span id="btnText">Ingresar</span>
            <span id="btnSpinner" class="hidden animate-spin">⏳</span>
          </button>
        </form>

        <!-- Credenciales de acceso -->
        <div class="mt-6 p-4 bg-blue-50 border border-blue-100 rounded-xl">
          <p class="text-xs font-semibold text-blue-700 uppercase tracking-wide mb-2">Credenciales por defecto</p>
          <div class="space-y-1.5 text-sm text-blue-800">
            <div class="flex justify-between items-center">
              <span class="font-medium">Administrador:</span>
              <code class="bg-blue-100 px-2 py-0.5 rounded">admin / admin123</code>
            </div>
            <div class="flex justify-between items-center">
              <span class="font-medium">Operador:</span>
              <code class="bg-blue-100 px-2 py-0.5 rounded">operador / operador123</code>
            </div>
            <div class="flex justify-between items-center">
              <span class="font-medium">Visualizador:</span>
              <code class="bg-blue-100 px-2 py-0.5 rounded">viewer / viewer123</code>
            </div>
          </div>
        </div>
      </div>

      <p class="text-center text-blue-300 text-xs mt-6">
        Arquitectura Orientada a Servicios · UTP 2026
      </p>
    </div>

    <script>
      // Mostrar/ocultar contraseña
      document.getElementById("togglePassword").addEventListener("click", () => {
        const input = document.getElementById("password");
        input.type = input.type === "password" ? "text" : "password";
      });

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const errorMsg = document.getElementById("errorMsg");
        const submitBtn = document.getElementById("submitBtn");
        const btnText = document.getElementById("btnText");
        const btnSpinner = document.getElementById("btnSpinner");

        errorMsg.classList.add("hidden");
        submitBtn.disabled = true;
        btnText.textContent = "Ingresando...";
        btnSpinner.classList.remove("hidden");

        try {
          const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await response.json();

          if (response.ok) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("rol", data.rol);
            localStorage.setItem("username", data.username);
            window.location.href = "/";
          } else {
            errorMsg.textContent = data.error || "Credenciales inválidas";
            errorMsg.classList.remove("hidden");
          }
        } catch {
          errorMsg.textContent = "Error de conexión. Verifica que el servidor esté activo.";
          errorMsg.classList.remove("hidden");
        } finally {
          submitBtn.disabled = false;
          btnText.textContent = "Ingresar";
          btnSpinner.classList.add("hidden");
        }
      });
    </script>
  </body>
</html>
