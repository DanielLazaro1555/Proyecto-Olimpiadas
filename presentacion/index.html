<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Presentación web del proyecto Sistema Olimpiadas Perú — SOA." />
    <title>Olimpiadas Perú — Presentación SOA</title>
    <link rel="stylesheet" href="assets/css/presentation.css" />
  </head>
  <body>
    <main id="presentation" class="presentation" aria-live="polite"></main>

    <footer class="controls" aria-label="Controles de la presentación">
      <button id="previous-button" class="control-button" type="button" aria-label="Diapositiva anterior">
        ← <span>Anterior</span>
      </button>
      <p id="slide-counter" class="slide-counter"></p>
      <button id="next-button" class="control-button control-button--primary" type="button" aria-label="Diapositiva siguiente">
        <span>Siguiente</span> →
      </button>
    </footer>

    <p class="keyboard-hint">Usa ← → o Espacio para navegar</p>
    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
